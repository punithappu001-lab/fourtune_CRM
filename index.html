<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><title>Four Tune CRM</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b2a3a">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#00122f;--card:#0a2149;--tx:#e9f0ff;--mu:#8ea5cf;--bd:#1b3a73;--ac:#2f8bff;--ac2:#22d3ee;--rd:#ff6b7a;--am:#f5c65a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eef3fb;--card:#fff;--tx:#0b1b3a;--mu:#5b6b8c;--bd:#d5deee;--ac:#1560e0;--ac2:#0891b2;--rd:#c0392b;--am:#b7791f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header b{font-size:16px;margin-right:auto}nav{display:flex;gap:4px;overflow-x:auto;padding:8px 16px}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button.on,.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:8px 16px 32px;max-width:1100px;margin:auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.k small{color:var(--mu)}.k div{font-size:20px;font-weight:600;margin-top:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:14px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
input,select{padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);width:100%}label{font-size:12px;color:var(--mu)}
.bar{height:14px;background:var(--ac);border-radius:3px}.pill{padding:2px 8px;border-radius:10px;background:var(--bd);font-size:12px}
.neg{color:var(--rd)}.pos{color:var(--ac)}h3{margin:4px 0 10px}.note{color:var(--mu);font-size:12px}
#sp{position:fixed;inset:0;background:#0b2a3a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;transition:opacity .6s}
#sp svg{width:110px;animation:pop 1.2s cubic-bezier(.2,1.4,.4,1) both}#sp p{color:#fff;opacity:0;margin-top:14px;font-size:16px;letter-spacing:2px;animation:fi .8s .7s forwards}
@keyframes pop{0%{transform:scale(.2) rotate(-180deg);opacity:0}100%{transform:none;opacity:1}}@keyframes fi{to{opacity:1}}
header{background:linear-gradient(90deg,#0b2a3a,#0f4c5c)!important;color:#fff}header svg{width:30px;display:block}header .note{color:#9fe3cf}
@media(max-width:640px){nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);z-index:5;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}main{padding-bottom:90px}}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(47,139,255,.18),transparent),var(--bg);background-attachment:fixed}
#sp{background:radial-gradient(circle at 50% 45%,#06307a 0,#00122f 65%)}
#sp img{width:170px;animation:rise 1.4s cubic-bezier(.2,.9,.3,1) both,glow 2.2s 1.2s ease-in-out infinite}
#sp p{font-weight:600;letter-spacing:5px;color:#cfe0ff;font-size:14px}#sp::after{content:"";width:140px;height:3px;margin-top:18px;border-radius:3px;background:linear-gradient(90deg,transparent,#22d3ee,transparent);animation:sweep 1.6s ease-in-out infinite}
@keyframes rise{0%{transform:translateY(30px) scale(.6) rotateY(90deg);opacity:0;filter:blur(8px)}100%{transform:none;opacity:1;filter:none}}
@keyframes glow{50%{filter:drop-shadow(0 0 22px rgba(34,211,238,.9))}}@keyframes sweep{0%{transform:scaleX(.2);opacity:.3}50%{transform:scaleX(1);opacity:1}100%{transform:scaleX(.2);opacity:.3}}
header{background:linear-gradient(90deg,#00122f,#0a2f6e)!important;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:6}header img{height:34px;display:block}header b{letter-spacing:.5px}
nav button,.btn{border-radius:20px;background:var(--card);border-color:var(--bd);transition:.2s}nav button:hover,.btn:hover{border-color:var(--ac)}
nav button.on,.btn.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff;box-shadow:0 4px 14px rgba(47,139,255,.4)}
.card,.k{border-radius:14px;box-shadow:0 6px 20px rgba(0,10,40,.25)}.k{border-top:3px solid var(--ac);background:linear-gradient(160deg,var(--card),transparent 160%)}.k div{background:linear-gradient(90deg,var(--tx),var(--ac2));-webkit-background-clip:text;background-clip:text}
.k div:not(:has(span)){-webkit-text-fill-color:transparent}h3{color:var(--ac2);font-weight:600}
.bar{background:linear-gradient(90deg,var(--ac),var(--ac2));height:12px}th{text-transform:uppercase;font-size:11px;letter-spacing:.6px}tr:hover td{background:rgba(47,139,255,.07)}
.pill{background:rgba(47,139,255,.18);color:var(--ac2)}.pos{color:var(--ac2)}input,select{border-radius:8px}input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
@media(max-width:640px){nav{background:#00122f;border-top:1px solid var(--bd)}}
</style></head><body>
